name: Prototype CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  bridge-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check WhatsApp bridge JavaScript syntax
        run: node --check examples/whatsapp-bot/bridge/index.js
      - name: Validate bridge package metadata
        run: node -e "JSON.parse(require('node:fs').readFileSync('examples/whatsapp-bot/bridge/package.json', 'utf8'))"
